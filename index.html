<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap">
<style>
/* Placeholder between dinner nights: a steaming cloche in fall colours under string lights. Tapping the lid peeks underneath. */
:root{
  --bg:#1B1310; --surface:#2A1D17; --fg:#F6ECDD; --muted:#C9B6A1; --line:#4A3529;
  --accent:#E9772B; --chili:#E3B04B; --moon:#F2D9A8; --leaf:#C2452D; --leaf2:#D98A2B;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;position:relative;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;display:flex;flex-direction:column;
  padding:calc(max(6px, env(safe-area-inset-top, 0px)) + 56px) max(16px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
/* String lights: one 120px swag tiled across the top, starting below the status bar so the glow never reaches the very top.
   ::after holds every other bulb so the strand can twinkle. */
body::before, body::after{content:"";position:absolute;left:0;right:0;top:max(6px, env(safe-area-inset-top, 0px));height:56px;background-repeat:repeat-x;background-position:center top;pointer-events:none}
body::before{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='56'><defs><radialGradient id='g'><stop offset='0' stop-color='%23FFC56E' stop-opacity='.55'/><stop offset='1' stop-color='%23FFC56E' stop-opacity='0'/></radialGradient></defs><path d='M0 6Q60 34 120 6' fill='none' stroke='%235A4334' stroke-width='2'/><circle cx='30' cy='26.5' r='14' fill='url(%23g)'/><rect x='27.5' y='15.5' width='5' height='5' rx='1' fill='%232E211A'/><ellipse cx='30' cy='26.5' rx='4.2' ry='5.8' fill='%23FFC86B'/><circle cx='90' cy='26.5' r='14' fill='url(%23g)'/><rect x='87.5' y='15.5' width='5' height='5' rx='1' fill='%232E211A'/><ellipse cx='90' cy='26.5' rx='4.2' ry='5.8' fill='%23FF9A4D'/></svg>")}
body::after{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='56'><defs><radialGradient id='g'><stop offset='0' stop-color='%23FFC56E' stop-opacity='.55'/><stop offset='1' stop-color='%23FFC56E' stop-opacity='0'/></radialGradient></defs><circle cx='60' cy='30' r='14' fill='url(%23g)'/><rect x='57.5' y='19' width='5' height='5' rx='1' fill='%232E211A'/><ellipse cx='60' cy='30' rx='4.2' ry='5.8' fill='%23FFE2A8'/></svg>")}
/* margin:auto centers vertically on tall screens but still scrolls from the top when content is taller than the screen. */
.wrap{max-width:30rem;width:100%;margin:auto;display:flex;flex-direction:column;align-items:flex-start;gap:14px}

.cloche{all:unset;cursor:pointer;width:min(220px, 60vw);margin:0 0 10px -6px;-webkit-tap-highlight-color:transparent}
.cloche:focus-visible{outline:3px solid var(--accent);outline-offset:6px;border-radius:12px}
.cloche svg{display:block;width:100%;height:auto;overflow:visible}
.plate{stroke:var(--line);stroke-width:7;stroke-linecap:round}
.dome, .knob{fill:var(--moon)}
.shine{fill:none;stroke:#fff;stroke-opacity:.45;stroke-width:6;stroke-linecap:round}
.steam path{fill:none;stroke:var(--muted);stroke-width:4;stroke-linecap:round;opacity:.6}
.leaves path{fill:var(--leaf)}
.leaves path:nth-child(2){fill:var(--leaf2)}
.eyes{font-size:30px;opacity:0;transition:opacity .2s}
.lid{transform-box:view-box;transform-origin:30px 124px;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.peek .lid{transform:rotate(-24deg)}
.peek .eyes{opacity:1}
.peek .steam{opacity:0}
.steam{transition:opacity .2s}
@media (prefers-reduced-motion: no-preference){
  .steam path{animation:steam 2.6s ease-in-out infinite;transform-box:fill-box}
  .steam path:nth-child(2){animation-delay:-.9s}
  .steam path:nth-child(3){animation-delay:-1.7s}
  body::after{animation:twinkle 1.8s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.3}to{opacity:1}}
  @keyframes steam{0%{opacity:0;transform:translateY(10px)}35%{opacity:.7}100%{opacity:0;transform:translateY(-16px)}}
}
@media (prefers-reduced-motion: reduce){.lid,.eyes{transition:none}}

.eyebrow{margin:0 0 -6px;font-size:.85rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--chili)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.6rem, 12vw, 3.6rem);line-height:1;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:4px 0 0;font-size:1.1rem;color:var(--muted);max-width:28ch}
.whisper{margin:0;min-height:1.5em;font-size:.9rem;color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main class="wrap">
  <button class="cloche" id="cloche" type="button" aria-label="Lift the lid">
    <svg viewBox="0 0 200 150" aria-hidden="true">
      <g class="steam">
        <path d="M78 40c-9-8 9-14 0-26"/>
        <path d="M100 34c-9-8 9-14 0-26"/>
        <path d="M122 40c-9-8 9-14 0-26"/>
      </g>
      <text class="eyes" x="100" y="118" text-anchor="middle">👀</text>
      <g class="lid">
        <path class="dome" d="M30 124a70 70 0 0 1 140 0z"/>
        <circle class="knob" cx="100" cy="50" r="8"/>
        <path class="shine" d="M56 104a48 48 0 0 1 26-32"/>
      </g>
      <path class="plate" d="M16 128h168"/>
      <g class="leaves">
        <path d="M0 0c5-7 14-8 20-2c-5 7-14 8-20 2z" transform="translate(160 120) rotate(-28)"/>
        <path d="M0 0c5-7 14-8 20-2c-5 7-14 8-20 2z" transform="translate(172 131) rotate(14)"/>
        <path d="M0 0c5-7 14-8 20-2c-5 7-14 8-20 2z" transform="translate(30 133) rotate(190)"/>
      </g>
    </svg>
  </button>
  <p class="eyebrow">🚧 Under construction</p>
  <h1>New plans<br><em>coming soon</em></h1>
  <p class="sub">Hard hats? Less likely than you&nbsp;think.</p>
  <p class="whisper" id="whisper" aria-live="polite"></p>
</main>
<script>
// Tap the lid: it tips up, shows 👀, scolds gently, and settles back down.
const cloche = document.getElementById('cloche'), whisper = document.getElementById('whisper');
const lines = [
  'Hey! No peeking.',
  'Cinnamon is going to hear about this!',
  'Peeking adds five minutes. House rules.',
  "Don't distract the chef.",
  'Shh. Almost ready. Probably.',
  'Smells like fall in here.',
  'Almost 👀'
];
let n = 0, timer;
cloche.addEventListener('click', () => {
  cloche.classList.add('peek');
  whisper.textContent = lines[n++ % lines.length];
  clearTimeout(timer);
  timer = setTimeout(() => { cloche.classList.remove('peek'); }, 1100);
});
</script>
</body>
</html>
