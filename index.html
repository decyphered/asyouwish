<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cat! Sunday night plans</title>
<meta name="description" content="Dinner, Dr. Orna, and excellent company. Your pick.">
<meta property="og:title" content="Cat! Sunday night plans">
<meta property="og:description" content="Dinner, Dr. Orna, and excellent company. Your pick.">
<meta property="og:image" content="https://dinnerwithcat.com/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://dinnerwithcat.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#15101F">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: one narrow column, a ticket-like menu. Header, the set "main event", dinner choices as big tap cards, sticky save bar. */
/* Single dark look on purpose: a Halloween night. Pumpkin orange for choices, slime green for small accents. */
:root{
  --bg:#15101F; --surface:#211A2E; --fg:#F3EEE6; --muted:#B8ADC8; --line:#3D3250;
  --accent:#FF7A1A; --accent-ink:#1A0F05; --accent-soft:#3A2418; --chili:#B6F25A; --moon:#F6E7B8;
  --spooky:"Creepster", "Chalkduster", fantasy, cursive;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px 0}
.wrap{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:28px;padding-bottom:120px}

header{display:flex;flex-direction:column;gap:6px;position:relative;padding-top:8px}
.night{position:absolute;top:-8px;right:0;width:112px;height:84px;pointer-events:none}
.night .moon{fill:var(--moon)}
.night .bat{fill:var(--fg);opacity:.85}
@media (prefers-reduced-motion: no-preference){
  .night .bat{animation:flap 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .night .bat2{animation-delay:-1.4s}
  @keyframes flap{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-4px) scaleY(.7)}}
}
.eyebrow{padding-right:120px;font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--chili)}
h1{margin:0;display:flex;flex-direction:column;gap:8px}
h1 .hi{font-family:var(--spooky);font-weight:400;font-size:3.8rem;line-height:1;letter-spacing:.03em;color:var(--accent)}
h1 .hi-sub{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.2;letter-spacing:-.01em;text-wrap:balance;max-width:22ch}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.drive label{border-style:dashed;border-color:var(--chili)}
.drive .car{flex:none;color:var(--chili)}
.lede{margin:6px 0 0;color:var(--muted);max-width:34ch}

h2{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0;letter-spacing:.01em}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hint{font-size:.85rem;color:var(--muted)}

.event{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1.5px dashed var(--chili);border-radius:14px;background:var(--surface)}
.event svg{flex:none;color:var(--chili)}
.event strong{font-family:var(--display);font-size:1.25rem;font-weight:700;display:block;line-height:1.2}
.event span{font-size:.85rem;color:var(--muted)}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;margin:0;pointer-events:none}
.choice label{display:flex;align-items:center;gap:14px;min-height:64px;padding:14px 16px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .15s, background .15s}
.choice .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:border-color .15s}
.choice .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .15s}
.choice .name{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.2}
.choice input:checked + label{border-color:var(--accent);background:var(--accent-soft)}
.choice input:checked + label .dot{border-color:var(--accent)}
.choice input:checked + label .dot::after{transform:scale(1)}
.choice input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}
.choice .txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.choice .sub{font-size:.85rem;color:var(--muted)}
.choice .more{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:600;color:var(--accent);
  padding:4px 10px;border:1.5px solid var(--accent);border-radius:999px}
.choice .more svg{transition:transform .2s}
#d-takeout:checked + label{border-bottom-left-radius:0;border-bottom-right-radius:0}
#d-takeout:checked + label .more svg{transform:rotate(180deg)}
#d-takeout:checked + label .more-word::after{content:"Pick a spot"}
#d-takeout:not(:checked) + label .more-word::after{content:"4 options"}

.spots{display:flex;flex-wrap:wrap;gap:8px;margin-top:-12px!important;padding:14px 14px 16px!important;
  background:var(--accent-soft);border:1.5px solid var(--accent)!important;border-top:0!important;border-radius:0 0 14px 14px}
.spots legend{float:left;width:100%;font-size:.85rem;color:var(--muted);margin-bottom:8px;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.spot{position:relative}
.spot input{position:absolute;opacity:0;inset:0;margin:0;pointer-events:none}
.spot label{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface);font-weight:600;cursor:pointer}
.spot input:checked + label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.spot input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}

.note label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:6px}
.other{flex-basis:100%}
.other label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:6px}
.other input{min-height:48px}
textarea, .other input{width:100%;min-height:72px;resize:vertical;font:inherit;color:var(--fg);background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
textarea:focus-visible, .other input:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

.saved{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--accent-soft)}
.saved svg{flex:none;color:var(--accent);margin-top:2px}
.saved p{margin:0}
.saved .when{font-size:.85rem;color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.bar-inner{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:6px}
button{font:inherit;font-weight:600;font-size:1.05rem;min-height:52px;border-radius:14px;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink)}
button:disabled{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);cursor:not-allowed}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.status{font-size:.85rem;color:var(--muted);text-align:center;min-height:1.3em;margin:0}
.status.err{color:var(--chili)}
.status.ok{color:var(--chili);font-weight:600;font-size:.95rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="night" viewBox="0 0 112 84" aria-hidden="true">
      <circle class="moon" cx="80" cy="34" r="26"></circle>
      <path class="bat" d="M14 30c4-6 9-7 12-4 1-3 3-4 4-4s3 1 4 4c3-3 8-2 12 4-4-1-7 0-8 3-2-2-5-2-6 1-1-2-2-3-2-3s-1 1-2 3c-1-3-4-3-6-1-1-3-4-4-8-3z"></path>
      <path class="bat bat2" d="M44 60c3-4 6-5 8-3 1-2 2-3 3-3s2 1 3 3c2-2 5-1 8 3-3-1-5 0-6 2-1-1-3-1-4 1l-1-2-1 2c-1-2-3-2-4-1-1-2-3-3-6-2z"></path>
    </svg>
    <span class="eyebrow">Sunday night &middot; spooky season</span>
    <h1><span class="hi">Cat!</span><span class="hi-sub">A night in with Dr. Orna, dinner, discussion, and excellent company</span></h1>
    <p class="lede">Big decision ahead. Noodle carefully!</p>
  </header>

  <div id="savedBox" class="saved" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    <div><p id="savedText"></p><p class="when" id="savedWhen"></p></div>
  </div>

  <section class="section" aria-labelledby="ev">
    <h2 id="ev">Main event</h2>
    <div class="event">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
      <div><strong>Couples Therapy</strong><span>Already on the schedule. No tricks.</span></div>
    </div>
  </section>

  <form id="pickForm" class="section" novalidate>
    <div class="section-head"><h2 id="dn">Dinner</h2><span class="hint">Pick one</span></div>
    <div class="choices" role="radiogroup" aria-labelledby="dn">
      <div class="choice">
        <input type="radio" name="dinner" id="d-psew" value="pad-see-ew">
        <label for="d-psew"><span class="dot" aria-hidden="true"></span><span class="name">Pad See Ew</span></label>
      </div>
      <div class="choice">
        <input type="radio" name="dinner" id="d-garlic" value="garlic-chicken-bowl">
        <label for="d-garlic"><span class="dot" aria-hidden="true"></span><span class="name">Garlic Chicken Bowl</span></label>
      </div>
      <div class="choice">
        <input type="radio" name="dinner" id="d-takeout" value="takeout">
        <label for="d-takeout" aria-controls="spotBox"><span class="dot" aria-hidden="true"></span><span class="txt"><span class="name">Takeout</span><span class="sub">Jeepney's, Beartooth, El Jefe, or your own</span></span><span class="more" aria-hidden="true"><span class="more-word"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></label>
      </div>
    </div>

    <fieldset id="spotBox" class="spots" hidden>
      <legend>From where?</legend>
      <div class="spot"><input type="radio" name="spot" id="s-jeepneys" value="Jeepney's"><label for="s-jeepneys">Jeepney's</label></div>
      <div class="spot"><input type="radio" name="spot" id="s-beartooth" value="Beartooth"><label for="s-beartooth">Beartooth</label></div>
      <div class="spot"><input type="radio" name="spot" id="s-eljefe" value="El Jefe"><label for="s-eljefe">El Jefe</label></div>
      <div class="spot"><input type="radio" name="spot" id="s-other" value="other"><label for="s-other">Somewhere else</label></div>
      <div class="other" id="otherWrap" hidden>
        <label for="otherSpot">Where?</label>
        <input type="text" id="otherSpot" maxlength="60" autocomplete="off" placeholder="Type a place">
      </div>
    </fieldset>

    <div class="or" aria-hidden="true">or</div>
    <div class="choices">
      <div class="choice drive">
        <input type="radio" name="dinner" id="d-drive" value="chefs-choice">
        <label for="d-drive"><span class="dot" aria-hidden="true"></span><span class="txt"><span class="name">Chef's choice</span><span class="sub">You decide. Surprise me.</span></span><svg class="car" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13.9V20h12v-6.1A4 4 0 0 0 17 6a5 5 0 0 0-10 0 4 4 0 0 0-1 7.9Z"/><path d="M6 16.5h12"/></svg></label>
      </div>
    </div>

    <div class="note">
      <label for="note">Anything else? (optional)</label>
      <textarea id="note" maxlength="300" placeholder="Requests, demands, cravings..."></textarea>
    </div>
  </form>
</div>

<div class="bar">
  <div class="bar-inner">
    <button type="submit" form="pickForm" id="saveBtn" disabled>Save my pick</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
