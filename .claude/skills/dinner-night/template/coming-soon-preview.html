<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,600&display=block">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#15101F;color:#F3EEE6;font-family:"DM Sans",sans-serif}
.copy{position:absolute;left:90px;top:0;bottom:10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:18px}
.eyebrow{font-size:26px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#B6F25A}
h1{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:112px;line-height:1;letter-spacing:-.02em}
h1 em{font-style:normal;color:#FF7A1A}
.sub{font-size:36px;color:#B8ADC8}
svg{position:absolute;right:70px;top:150px;width:360px;overflow:visible}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:#FF7A1A}

<body>
<svg viewBox="0 0 200 150">
  <g fill="none" stroke="#B8ADC8" stroke-width="4" stroke-linecap="round" opacity=".6">
    <path d="M78 40c-9-8 9-14 0-26"/><path d="M100 34c-9-8 9-14 0-26"/><path d="M122 40c-9-8 9-14 0-26"/>
