<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,500;9..40,600&display=block">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;color:#F3EEE6;font-family:"DM Sans",sans-serif;
  background:radial-gradient(circle at 1010px 165px, rgba(246,231,184,.09), transparent 420px) #15101F}
.copy{position:absolute;left:90px;top:0;bottom:10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
h1{margin:0;font-family:"Creepster",cursive;font-weight:400;font-size:220px;line-height:.95;letter-spacing:.03em;color:#FF7A1A}
.date{margin-top:16px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:56px;line-height:1.1}
.tag{margin-top:18px;font-size:26px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#B6F25A;
  border:3px solid #B6F25A;border-radius:999px;padding:7px 24px}
.sub{margin-top:36px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:40px;line-height:1.2;color:#B8ADC8}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:#FF7A1A}
svg{position:absolute;right:60px;top:40px;overflow:visible}
</style></head>
<body>
<svg width="336" height="252" viewBox="0 0 112 84">
  <defs><radialGradient id="g"><stop offset=".5" stop-color="#F6E7B8" stop-opacity=".28"/><stop offset="1" stop-color="#F6E7B8" stop-opacity="0"/></radialGradient></defs>
  <circle cx="80" cy="34" r="52" fill="url(#g)"/>
  <circle cx="80" cy="34" r="26" fill="#F6E7B8"/>
  <path fill="#F3EEE6" opacity=".85" d="M14 30c4-6 9-7 12-4 1-3 3-4 4-4s3 1 4 4c3-3 8-2 12 4-4-1-7 0-8 3-2-2-5-2-6 1-1-2-2-3-2-3s-1 1-2 3c-1-3-4-3-6-1-1-3-4-4-8-3z"/>
  <path fill="#F3EEE6" opacity=".85" d="M44 60c3-4 6-5 8-3 1-2 2-3 3-3s2 1 3 3c2-2 5-1 8 3-3-1-5 0-6 2-1-1-3-1-4 1l-1-2-1 2c-1-2-3-2-4-1-1-2-3-3-6-2z"/>
</svg>
<div class="copy">
  <h1>Cat!</h1>
  <div class="date">Sunday, October 25</div>
  <div class="tag">Spooky season hang</div>

</div>
<div class="bar"></div>
