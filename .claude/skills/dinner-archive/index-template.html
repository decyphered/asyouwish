<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dinner nights</title>
<meta name="theme-color" content="#1C1410">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap">
<style>
:root{
  --bg:#1C1410; --surface:#2A1E17; --fg:#F5ECE1; --muted:#C4B3A2; --line:#45342A; --accent:#E8793A; --chili:#E9B949;
  --display:"Bricolage Grotesque", system-ui, sans-serif; --body:"DM Sans", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:max(28px, env(safe-area-inset-top)) 16px 48px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-family:"Shrikhand", serif;font-weight:400;font-size:2.2rem;line-height:1.1;color:var(--accent)}
.lede{margin:-12px 0 0;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
a.night{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:var(--surface);
  border:1.5px solid var(--line);color:inherit;text-decoration:none;transition:border-color .15s}
a.night:hover, a.night:focus-visible{border-color:var(--accent)}
a.night:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.day{flex:none;width:52px;text-align:center;font-family:var(--display);font-weight:700;line-height:1.1}
.day b{display:block;font-size:1.5rem;color:var(--chili)}
.day span{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.txt{display:flex;flex-direction:column;min-width:0}
.txt strong{font-family:var(--display);font-size:1.05rem}
.txt span{color:var(--muted);font-size:.9rem}
.empty{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dinner nights</h1>
  <p class="lede">Every night we've planned, newest first.</p>
  <ol>
{{NIGHTS}}
  </ol>
</div>
</body>
</html>
